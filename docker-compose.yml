# AI Deception Grid — single-host lab.
#
# Containment model (IMPORTANT):
#   * `deception` network is marked `internal: true` -> containers on it have NO
#     route to the internet. Decoys and traps cannot phone home or pivot outward.
#   * Only the `hub` also joins the `frontend` network, which exists solely to
#     publish the dashboard to the operator's browser. Nothing else is exposed.
#
# Everything here is synthetic. No real credentials or data.

networks:
  deception:
    internal: true        # no egress: decoys/traps are sealed off from the internet
  frontend:               # operator-facing only; carries the dashboard

volumes:
  events: {}              # SQLite event store (hub-owned)
  cowrie_logs: {}         # shared between cowrie and its forwarder sidecar
  fileserver_logs: {}     # samba audit log, shared with the fileserver forwarder

services:
  # ---- Central hub: ingest + detection + dashboard -------------------------
  hub:
    build:
      context: .              # root context: hub imports the shared core/ package
      dockerfile: hub/Dockerfile
    environment:
      EVENTS_DB: /data/events.db
      # Optional SOC alerting for high/critical alerts (no-op if unset):
      ALERT_WEBHOOK: ${ALERT_WEBHOOK:-}   # generic or Slack (hooks.slack.com) URL
      ALERT_SYSLOG: ${ALERT_SYSLOG:-}     # host:port (UDP) or "local"
    volumes:
      - events:/data
      - ./config:/app/config:ro
    networks: [deception, frontend]
    ports:
      - "8000:8000"       # dashboard (operator only)

  # ---- Behavior engine: simulated employees --------------------------------
  personas:
    build:
      context: .              # root context: engine imports the shared core/ package
      dockerfile: personas/Dockerfile
    environment:
      HUB_URL: http://hub:8000
      TIME_SCALE: ${TIME_SCALE:-288}
      # Personas emit their benign events directly (with correct home IPs) AND
      # generate real network traffic. They authenticate to SMB as the shared
      # "employee" account; the fileserver forwarder skips that user (already
      # logged) and reports only the anonymous attacker — so real traffic is
      # realistic without being double-counted or misclassified.
      PERSONA_LIVE: "1"
      SMB_USER: employee
      SMB_PASS: labpass
      SMB_SHARE: company
    volumes:
      - ./config:/app/config:ro
    networks: [deception]
    depends_on: [hub, fileserver, intranet, jumphost]

  # ---- Real, usable decoy services (personas use them; attackers find them) -
  fileserver:             # Samba share seeded with AI-generated (canaried) docs
    build: ./traps/fileserver
    volumes:
      - ./seed/generated:/share:ro   # run `make generate` first to populate
      - fileserver_logs:/var/log/samba/audit
    networks: [deception]

  fileserver-forwarder:   # sidecar: tails samba audit log -> hub (exfil + canary)
    build:
      context: ./traps
      dockerfile: forwarder/Dockerfile
    command: ["python", "/app/samba_forward.py"]
    environment:
      HUB_URL: http://hub:8000
      AUDIT_LOG: /var/log/samba/audit/audit.log
      CANARY_MANIFEST: /seed/canary_manifest.json
      PERSONA_SMB_USER: employee   # skip authenticated persona reads; forward only the attacker
    volumes:
      - fileserver_logs:/var/log/samba/audit:ro
      - ./seed/generated:/seed:ro
    networks: [deception]
    depends_on: [hub, fileserver]

  intranet:               # fake internal web portal
    build: ./traps/intranet
    networks: [deception]

  jumphost:               # plain SSH host personas legitimately log into
    build: ./traps/jumphost
    networks: [deception]

  mail:                   # fake internal mail (Mailpit — multi-arch, runs on amd64+arm64)
    image: axllent/mailpit:latest
    networks: [deception]

  tarpit:                 # AI adaptive engagement — serves believable fake content to burn attacker time
    build:
      context: .              # root context: imports the shared core/ package
      dockerfile: engagement/Dockerfile
    environment:
      HUB_URL: http://hub:8000
      TARPIT_DELAY_MS: "1500"   # deliberately slow responses (capped) to waste time
    networks: [deception]
    depends_on: [hub]

  # ---- Pure traps: any interaction is an attacker --------------------------
  cowrie:                 # SSH/Telnet honeypot (unmodified upstream image)
    image: cowrie/cowrie:latest
    volumes:
      - cowrie_logs:/cowrie/cowrie-git/var/log/cowrie
    networks: [deception]

  cowrie-forwarder:       # sidecar: tails cowrie's JSON log -> hub events
    build:
      context: ./traps
      dockerfile: forwarder/Dockerfile
    command: ["python", "/app/cowrie_forward.py"]
    environment:
      HUB_URL: http://hub:8000
      COWRIE_LOG: /logs/cowrie.json
    volumes:
      - cowrie_logs:/logs:ro
    networks: [deception]
    depends_on: [hub, cowrie]

  opencanary:             # multi-service tripwire (ftp/http/mysql/smb)
    build: ./traps/opencanary
    environment:
      HUB_URL: http://hub:8000
    networks: [deception]
    depends_on: [hub]
