[global]
   workgroup = MERIDIAN
   server string = Meridian Logistics File Server
   security = user
   map to guest = Bad User
   guest account = nobody
   # Older dialect keeps smbclient guest browsing simple in the lab.
   server min protocol = NT1
   log level = 1
   disable spoolss = yes
   load printers = no
   printing = bsd
   printcap name = /dev/null

   # Audit every file open and forward it (via rsyslog -> shared log -> sidecar).
   vfs objects = full_audit
   full_audit:prefix = %u|%I|%S
   full_audit:success = openat
   full_audit:failure = none
   full_audit:facility = local7
   full_audit:priority = notice

[company]
   comment = Meridian Logistics file share
   path = /share
   browseable = yes
   read only = yes
   guest ok = yes
