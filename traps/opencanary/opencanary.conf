{
    "device.node_id": "canary-multi",
    "ip.autodetect": false,

    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": {
                "plain": {"format": "%(message)s"}
            },
            "handlers": {
                "file": {
                    "class": "logging.FileHandler",
                    "filename": "/var/log/opencanary/opencanary.log",
                    "formatter": "plain"
                }
            }
        }
    },

    "ftp.enabled": true,
    "ftp.port": 21,
    "ftp.banner": "FTP server ready",

    "http.enabled": true,
    "http.port": 80,
    "http.banner": "Meridian Logistics Intranet",
    "http.skin": "basicLogin",

    "mysql.enabled": true,
    "mysql.port": 3306,
    "mysql.banner": "5.7.31-0ubuntu0.16.04.1",

    "smb.enabled": true,
    "smb.port": 445,

    "telnet.enabled": false,
    "ssh.enabled": false,
    "mssql.enabled": false,
    "redis.enabled": false,
    "tftp.enabled": false,
    "ntp.enabled": false,
    "vnc.enabled": false,
    "sip.enabled": false,
    "snmp.enabled": false,

    "portscan.enabled": true,
    "portscan.logfile": "/var/log/opencanary/portscan.log",
    "portscan.synrate": 5,
    "portscan.nmaposrate": 5,
    "portscan.lorate": 3,
    "portscan.ignore_localhost": false
}
